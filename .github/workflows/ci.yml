name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test harness
        run: npm test

      - name: Check bootstrap syntax
        run: bash -n scripts/bootstrap.sh

      - name: Verify sandbox install
        run: |
          node scripts/meta-harness.mjs install --target "$RUNNER_TEMP/pi-agent"
          node scripts/meta-harness.mjs doctor --target "$RUNNER_TEMP/pi-agent"
